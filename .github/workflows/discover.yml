# Finds where the CEC publishes the 2026 files (results by ballot box and by locality, the per-station
# turnout ordered on 16.8.2026, double envelopes, the national hourly turnout page) and what each holds.
# GitHub's runners reach the CEC hosts; the build container does not. The report goes to the ops-reports
# branch (reports/latest.md, reports/discover-YYYYMMDD-HHMM.*, Israel time), never to main: Pages builds
# from main. The bytes of every candidate turnout / results file go with it (reports/files/<stamp>/, up to
# 8 MB each, each version once), so a release the feed cannot read can be converted by someone who cannot
# reach gov.il. How to read it and what to do: docs/FILE_DISCOVERY.md.
# The CEC's WAF: since 22.10 bechirot.gov.il answers urllib with an AWS WAF challenge; discover.py then asks the CEC's
# hosts as the feed does, through a headless Chrome with its own User-Agent (playwright, installed below; the runner's
# Chrome, exported as LIVE_CHROME, as in live.yml). The report's first lines say whether the WAF was seen and whether the
# browser got past it; a URL it did not get past is waf-challenge, never a file.
# GitHub fires the crons, and offers Run workflow, only for a workflow on the default branch (main): this file
# must be on main before the first run (15.10 08:43 Israel time).
# Requests: the election-day operator (a Claude session) can push but cannot dispatch (403), so a push to the
# ops-control branch that changes ops/request.json stands in for Run workflow:
# {"workflow": "discover", "mode": "full", "urls": "https://…", "runner": "ubuntu-latest", "id": "…"}, every field
# but workflow optional (docs/FILE_DISCOVERY.md). The job "request" reads it; a request for another workflow ends
# there. The scan runs with the code of the pushed commit (ops-control is made from origin/main each time) and
# writes to ops-reports only (discover.py --branch, never the triggering branch), in the same group as other runs.
name: Find the election files

on:
  schedule:
    # cron is UTC; Israel is UTC+3 until 24.10 and UTC+2 from 25.10
    - cron: '43 5 15-26 10 *'        # daily 15–26.10 at 08:43 (07:43 from 25.10)
    - cron: '7,27,47 4-20 27 10 *'   # 27.10 every 20 minutes, 06:07–22:47 (the :07 run of each hour is a full one)
    - cron: '7 21 27 10 *'           # 27.10 23:07
    - cron: '13 22-23 27 10 *'       # hourly: 28.10 00:13 and 01:13
    - cron: '13 * 28 10 *'           #         28.10 02:13 – 29.10 01:13
    - cron: '13 0-21 29 10 *'        #         29.10 02:13 – 23:13
  push:                              # the operator's requests (above): ops-control only, never main
    branches: [ops-control]
    paths: ['ops/request.json']
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = every guessed name too; quick = known files, what the pages link to, and what answered last time; auto = full, except two of the three runs an hour on 27.10'
        type: choice
        options: [auto, full, quick]
        default: auto
      urls:
        description: 'Extra URLs to check, separated by spaces (e.g. an address named in a CEC announcement)'
        type: string
        default: ''
      runner:
        description: 'Runner label, e.g. self-hosted (empty = the repository variable DISCOVER_RUNNER, else ubuntu-latest)'
        type: string
        default: ''

permissions:
  contents: write        # pushes to the ops-reports branch only

jobs:
  request:
    # a push to ops-control: ops/request.json in place of the dispatch inputs (scheduled and manual runs skip this)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.request.outputs.run }}
      mode: ${{ steps.request.outputs.mode }}
      urls: ${{ steps.request.outputs.urls }}
      runner: ${{ steps.request.outputs.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: ops
          persist-credentials: false
      - name: Read the request (ops/request.json on ops-control)
        id: request
        env:
          WORKFLOW: discover
          FIELDS: 'mode urls runner'
        run: |
          # A push to the ops-control branch is the operator's Run workflow: the session's token can push but not
          # dispatch (docs/ELECTION_DAY.md, "בקשות דרך ops-control"). ops/check_request.py goes on (run=true) only for
          # a request that names this workflow (WORKFLOW), its fields (FIELDS: the dispatch inputs) checked as tightly
          # as Run workflow checks them; a request for another workflow ends here, quietly (run=false); one that does
          # not parse, names no known workflow, or has a field or value this workflow does not take, goes red. Other
          # events: run=true, nothing read. The same step in live.yml, discover.yml, net-check.yml and daily.yml;
          # live.yml's loop runs the same check on a restart request (pipeline/test_live.py runs both).
          if [ "$GITHUB_EVENT_NAME" != push ]; then echo 'run=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 ops/check_request.py ops/request.json

  discover:
    needs: request
    # !cancelled(): the request job is skipped on schedule and dispatch; a push runs only for a discover request
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.request.outputs.run == 'true') }}
    # a separate variable from LIVE_RUNNER: a self-hosted runner busy with the 345-minute live feed would
    # leave these runs queued behind it. No automatic fallback: if that machine is offline, a run waits queued
    # (up to 24 h) and holds the `discover` concurrency group, so every later run, a hosted dispatch or request
    # included, waits behind it. Delete DISCOVER_RUNNER, cancel the queued run (both the owner's), then dispatch or
    # request with runner=ubuntu-latest (docs/FILE_DISCOVERY.md, "כששרתי GitHub נחסמים").
    runs-on: ${{ needs.request.outputs.runner || github.event.inputs.runner || vars.DISCOVER_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    concurrency:
      # one scan at a time, scheduled, manual or requested (one running, one pending). On the job, not the workflow:
      # a push whose request is for another workflow skips this job, with a group of its own, so it never replaces
      # a pending scan
      group: ${{ (github.event_name != 'push' || needs.request.outputs.run == 'true') && 'discover' || format('discover-skipped-{0}', github.run_id) }}
      cancel-in-progress: false
    steps:
      - name: Only 15–29.10.2026 (a cron has no year field; these would fire again every October)
        id: window
        run: |
          d=$(date -u +%Y%m%d)
          if [ "$GITHUB_EVENT_NAME" = schedule ] && { [ "$d" -lt 20261015 ] || [ "$d" -gt 20261029 ]; }; then
            echo "::notice::Outside 15–29.10.2026: nothing to do. Disable or delete this workflow (docs/FILE_DISCOVERY.md)."
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        if: steps.window.outputs.run == 'true'
      - uses: actions/setup-python@v7
        if: steps.window.outputs.run == 'true' && runner.environment == 'github-hosted'
        with:
          python-version: '3.12'
      - name: numpy (lets the report run the feed's own readers on result and turnout files)
        if: steps.window.outputs.run == 'true'
        run: python3 -m pip install -q numpy || echo '::warning::numpy not installed; the reader checks are emulated or skipped'
      - name: The browser path (playwright and this runner's Chrome) for the CEC's WAF
        if: steps.window.outputs.run == 'true'
        env:
          CHROME_VAR: ${{ vars.LIVE_CHROME }}   # a self-hosted runner's Chrome, when it is not in the usual places
        run: |
          # Since 22.10 bechirot.gov.il answers urllib with an AWS WAF challenge (HTTP 202); the scan then asks the CEC's
          # hosts as the feed does: the same URL through a headless Chrome with its own User-Agent, driven by playwright
          # (pipeline/cec_fetch.py, pipeline/browser_fetch.py). live.yml's step (pipeline/test_live.py keeps the two the
          # same): the package only, never `playwright install`, the hosted runner has Google Chrome. A missing piece is a
          # warning, not a red run: the report then lists the challenged URLs as waf-challenge and says so in its first
          # lines. A self-hosted runner (DISCOVER_RUNNER): its own Chrome (LIVE_CHROME, a repository variable or the
          # runner's environment, else the usual places), or none
          python3 -c 'import playwright.sync_api' 2>/dev/null || python3 -m pip install -q playwright > /dev/null 2>&1 \
            || python3 -m pip install -q --user --break-system-packages playwright > /dev/null 2>&1 \
            || echo "::warning::playwright not installed: discovery cannot ask through the browser if the CEC's WAF challenges it"
          chrome=''
          for c in "${CHROME_VAR:-}" "${LIVE_CHROME:-}" /opt/google/chrome/chrome google-chrome google-chrome-stable chromium chromium-browser \
                   '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'; do
            [ -n "$c" ] || continue
            p=$(command -v "$c" 2>/dev/null) || continue
            if [ -f "$p" ] && [ -x "$p" ]; then chrome=$p; break; fi
          done
          if [ -n "$chrome" ]; then
            echo "LIVE_CHROME=$chrome" >> "$GITHUB_ENV"
            echo "the browser path: $chrome, playwright $(python3 -c 'from importlib.metadata import version; print(version("playwright"))' 2>/dev/null || echo 'not installed')"
          else
            echo "::warning::no Chrome or Chromium on this runner (LIVE_CHROME, /opt/google/chrome/chrome, google-chrome, chromium): discovery cannot ask through the browser if the CEC's WAF challenges it"
          fi
      - name: Probe the CEC hosts and push the report to ops-reports
        if: steps.window.outputs.run == 'true'
        env:
          MODE: ${{ needs.request.outputs.mode || github.event.inputs.mode || 'auto' }}
          URLS: ${{ needs.request.outputs.urls || github.event.inputs.urls }}
        run: |
          set -f          # split the input on spaces, never expand it as a file pattern
          extra=()
          for u in $URLS; do
            case "$u" in https://*|http://*) extra+=(--url "$u") ;; *) echo "::warning::ignored (not a URL): $u" ;; esac
          done
          python3 pipeline/discover.py --mode "$MODE" --out "$RUNNER_TEMP/discover" --push \
            --summary "$GITHUB_STEP_SUMMARY" "${extra[@]}"
          {
            echo
            echo "Full report: https://github.com/$GITHUB_REPOSITORY/blob/ops-reports/reports/latest.md"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the report and the stored files with the run (also when the push failed)
        if: always() && steps.window.outputs.run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: discover-report
          path: ${{ runner.temp }}/discover/
          retention-days: 14
          if-no-files-found: ignore
