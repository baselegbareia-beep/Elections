# Election day & night feed: runs pipeline/live_fetch.py in a loop (one pass a minute) and publishes its
# live/*.json for the page. The path follows the Pages setting, checked at the start of every run:
#   branch mode  (Settings → Pages: "Deploy from a branch: main / (root)", the owner's setting): the files are
#                committed to site/live/ on main and a Pages build is requested (POST /pages/builds; pushes made
#                with GITHUB_TOKEN are documented as not starting one), at most once every publish_every_min
#                minutes (pipeline/live_config.json, default 8: branch builds have a soft limit of 10 an hour and
#                the operator's pushes to main count too); the first results file and the first exit polls after
#                22:00 go out at once. The cadence carries over from one run to the next (live_fetch.seed).
#   Actions mode ("GitHub Actions"): the files go to the live-data branch and pages.yml is dispatched.
#   unknown      (the check failed): branch mode, which works under both settings, plus a warning.
# The live folder has one writer at a time: this workflow or the laptop fallback (live_fetch.py --publish);
# both run the same code (live_fetch.publish: fetch, reset --hard to the remote tip, copy, commit only the live
# folder, push; never rebase), so a rejected push (the operator pushed to main in between) is simply repeated.
# Pushes made with GITHUB_TOKEN start no other workflow, and pages.yml / official-data.yml ignore site/live/**.
#
# Scheduled runs fire only from the default branch (main). GitHub may delay runs queued on the hour,
# so the crons sit off the hour; on election morning also start a run by hand as a backup.
# Israel is UTC+2 from 25.10.2026: polls open 07:00 = 05:00 UTC, close 22:00 = 20:00 UTC.
# Coverage: 27–29.10 continuous (345-minute runs chain every 20 minutes: the regular count ends
# 28.10 noon, the double envelopes are counted 28.10 evening to 29.10); 30.10–4.11 a 20-minute run
# every hour until the final file (published up to 4.11). Cron has no year: a scheduled run outside 2026
# does nothing (the first step), so the workflow does not wake up again next October.
# Builds: a feed with nothing new but timestamps publishes only every 30 minutes (60 from 28.10 12:00), so
# quiet hours cost about two Pages builds an hour, not seven (live_fetch.quiet_every).
# Switches: repository variable LIVE_RUNNER=self-hosted moves every run (scheduled ones too) to the
# runner in Israel; LIVE_FEED_OFF=true stops scheduled runs (manual runs still work);
# "github_feed": false in pipeline/live_config.json stops a running loop so a laptop can take over.
# A running loop is replaced only when it ends: to switch at once, cancel the active run.
name: Election day live feed

on:
  schedule:
    - cron: '7,27,47 4-23 27 10 *'      # 27.10, 06:07–01:47 Israel time, every 20 min (345-minute runs chain)
    - cron: '7,27,47 0-23 28,29 10 *'   # 28–29.10: the regular count ends, then the double envelopes, continuous
    - cron: '7 * 30,31 10 *'            # 30–31.10: a 20-minute run every hour, until the final file
    - cron: '7 * 1-4 11 *'              # 1–4.11: the same; the final result is published by 4.11
  workflow_dispatch:
    inputs:
      minutes:
        description: 'How long this run keeps polling (hosted jobs stop at 6 h; default 345 on 27–29.10, 20 later; a drill: 40)'
        default: ''
      drill:
        description: 'Rehearsal: the 2022 file (media25, else data/official) counted progressively; the page says "תרגול"; cleaned up at the end. Refused if it would still run (plus 15 minutes) at 24.10 00:00, and from then until 6.11'
        type: boolean
        default: false
      reset:
        description: 'Put the placeholder back in the published live folder and rebuild the page (nothing else runs)'
        type: boolean
        default: false
      runner:
        description: 'ubuntu-latest (GitHub) or self-hosted (a Linux/macOS computer in Israel); empty = the LIVE_RUNNER variable'
        default: ''

permissions:
  contents: write    # branch mode: commit site/live/ to main; Actions mode: push to live-data
  pages: write       # read the Pages source, and request a Pages build after each publish (branch mode)
  actions: write     # Actions mode: dispatch pages.yml with GITHUB_TOKEN (workflow_dispatch is the documented exception)

concurrency:
  group: live-feed
  cancel-in-progress: false    # a new run waits for the current one, so coverage is continuous

jobs:
  feed:
    if: github.event_name == 'workflow_dispatch' || vars.LIVE_FEED_OFF != 'true'
    # the CEC's 2026 CDN may refuse GitHub's cloud addresses; a self-hosted runner in Israel avoids that
    runs-on: ${{ inputs.runner || vars.LIVE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 355
    env:
      DRILL: ${{ inputs.drill == true }}
      RESET: ${{ inputs.reset == true }}
      MINUTES: ${{ inputs.minutes }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}   # empty on schedule events
      GH_TOKEN: ${{ github.token }}
      # seconds the feed waits after a push before asking whether the push itself started a Pages build (then it
      # requests none); repository variable LIVE_BUILD_WAIT, e.g. 45 if the drill shows two builds per publish
      LIVE_BUILD_WAIT: ${{ vars.LIVE_BUILD_WAIT || '15' }}
    steps:
      - name: Election window, minutes for this run, and the drill guard
        id: guard
        run: |
          # NOW_S (a Unix time) stands in for the clock in pipeline/test_live.py; GNU date reads it with -d, BSD
          # date (a macOS self-hosted runner) with -r
          now_s=${NOW_S:-$(date +%s)}
          ildate() { TZ=Asia/Jerusalem date -d "@$now_s" "$1" 2>/dev/null || TZ=Asia/Jerusalem date -r "$now_s" "$1"; }
          # cron has no year: outside 2026 a scheduled run does nothing (no heartbeat commits to main next October)
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$(ildate +%Y)" != 2026 ]; then
            echo "off=true" >> "$GITHUB_OUTPUT"
            echo "outside the 2026 election: nothing to do" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "$MINUTES" ]; then
            case "$(ildate +%d.%m)" in 27.10|28.10|29.10) MINUTES=345 ;; *) MINUTES=20 ;; esac
          fi
          case "$MINUTES" in ''|*[!0-9]*) echo "::error::minutes must be a whole number of minutes, not '$MINUTES'"; exit 1 ;; esac
          MINUTES=$((10#$MINUTES))
          echo "MINUTES=$MINUTES" >> "$GITHUB_ENV"
          # a rehearsal puts a full poll-based projection on the public page, and its reset at the end puts the
          # placeholder back. Refused when it would still run (plus 15 minutes for the reset and its build) at the
          # start of the poll ban, 24.10 00:00 Israel time, and from then until 6.11 00:00: it must not show during
          # the ban or the vote, nor overwrite (and its reset delete) the real night's files (WF-2; live_fetch.py
          # applies the same rule, and its --seed refuses a drill over real files)
          ban=1792789200    # 24.10.2026 00:00 Israel time (23.10 21:00 UTC)
          back=1793916000   # 6.11.2026 00:00 Israel time (5.11 22:00 UTC)
          if [ "$DRILL" = true ] && [ "$RESET" != true ] && [ $(( now_s + (MINUTES + 15) * 60 )) -ge "$ban" ] && [ "$now_s" -lt "$back" ]; then
            echo "::error::no drill that runs into 24.10 00:00 Israel time (the poll ban: $MINUTES minutes from $(ildate '+%d.%m %H:%M'), plus 15 for the reset), nor from then until 6.11: the page would show a rehearsal projection during the ban or the vote, or the drill would overwrite the real files"
            exit 1
          fi
          echo "minutes=$MINUTES drill=$DRILL"
      - uses: actions/checkout@v6
        if: steps.guard.outputs.off != 'true'
      - uses: actions/setup-python@v7
        if: steps.guard.outputs.off != 'true' && runner.environment == 'github-hosted'   # a self-hosted runner uses its own python3 (>= 3.9 with numpy)
        with:
          python-version: '3.12'
      - if: steps.guard.outputs.off != 'true'
        run: python3 -c 'import numpy' 2>/dev/null || python3 -m pip install -q numpy || python3 -m pip install -q --user --break-system-packages numpy
      - name: The publishing path
        if: steps.guard.outputs.off != 'true'
        run: |
          # Which Pages source is configured? "legacy" = Deploy from a branch -> branch mode (site/live/ on the
          # branch Pages serves); "workflow" = GitHub Actions -> the live-data branch; anything else = the check
          # itself failed (API, token, network): branch mode, which reaches the page under both settings
          resp=$(curl -sS -m 30 -w '\n%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                   "https://api.github.com/repos/$GITHUB_REPOSITORY/pages" 2>/dev/null) || resp=$'\n000'
          http=${resp##*$'\n'}
          info=$(printf '%s' "${resp%$'\n'*}" | python3 -c 'import json,sys; d=json.load(sys.stdin) or {}; print(d.get("build_type") or "-", (d.get("source") or {}).get("branch") or "-")' 2>/dev/null) || info='- -'
          src=${info%% *}; pbranch=${info##* }
          [ "$pbranch" = - ] && pbranch=$DEFAULT_BRANCH
          case "$src" in
            legacy)
              mode=branch
              echo "## Publishing: branch mode (Pages deploys from $pbranch)" >> "$GITHUB_STEP_SUMMARY"
              echo "site/live/ is committed to $pbranch and a Pages build is requested, at most every publish_every_min minutes (pipeline/live_config.json)." >> "$GITHUB_STEP_SUMMARY" ;;
            workflow)
              mode=actions
              echo "## Publishing: Actions mode (Pages Source: GitHub Actions): the live-data branch + a dispatch of pages.yml" >> "$GITHUB_STEP_SUMMARY" ;;
            *)
              src=error; mode=branch
              echo "::warning::the Pages source check failed (GET /repos/$GITHUB_REPOSITORY/pages: http=$http); publishing to site/live/ on $pbranch (branch mode)"
              {
                echo "## :warning: The Pages source check failed (http=$http): publishing in branch mode"
                echo
                echo "This is the check itself (API, token or network), not the Pages setting. Branch mode (site/live/ on $pbranch"
                echo "plus a Pages build request) reaches the page under both settings; see docs/ELECTION_DAY.md (תקלות)."
              } >> "$GITHUB_STEP_SUMMARY" ;;
          esac
          if [ "$mode" = branch ]; then wt=lm; else wt=ld; fi
          {
            echo "PAGES_SOURCE=$src"
            echo "PUBLISH_MODE=$mode"
            echo "PUB_ARGS=--mode $mode --branch $pbranch --wt $wt --ref $DEFAULT_BRANCH"
          } >> "$GITHUB_ENV"
          echo "minutes=$MINUTES pages_source=$src publish_mode=$mode branch=$pbranch drill=$DRILL reset=$RESET runner=$RUNNER_NAME ($RUNNER_OS)"
      - name: Prepare the publishing worktree and seed this run from the published files
        if: steps.guard.outputs.off != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf lm ld _live _probe; git worktree prune   # a reused self-hosted workspace keeps stale registrations (OPS-5)
          # history, last good files, state and the publishing cadence from the published folder, except a
          # rehearsal's (OPS-3); a drill is refused here while the published files are the real election's (WF-2)
          seed=(--out _live --seed)
          if [ "$DRILL" = true ] && [ "$RESET" != true ]; then seed+=(--drill --minutes "$MINUTES"); fi
          # shellcheck disable=SC2086
          python3 pipeline/live_fetch.py "${seed[@]}" $PUB_ARGS
          ls -la _live
      - name: Smoke test (drill only)
        if: steps.guard.outputs.off != 'true' && env.DRILL == 'true'
        env:
          HEALTH_GATE: '1'   # the code's health only: main's site/live/ need not be the placeholder here (WF-4)
        run: python3 pipeline/test_live.py
      - name: One unpublished pass (does the script run here, and does this runner reach media26?)
        if: steps.guard.outputs.off != 'true'
        run: |
          # a crash here (a bad file on main, numpy missing) makes the run red before the loop, not a silent green run (WF-2)
          out=$(python3 pipeline/live_fetch.py --out _probe --once 2>&1) || true
          printf '%s\n' "$out" | tail -n 4 | cut -c1-600
          printf '%s\n' "$out" | tail -n 1 \
            | python3 -c 'import json,sys; s=json.load(sys.stdin); print("ok: results_state", s.get("results_state"), "probe", s.get("results_probe"), "publish_mode", s.get("publish_mode"), "errors", s.get("errors"))'
      - name: Poll the elections committee and publish
        if: steps.guard.outputs.off != 'true'
        run: |
          # the placeholder back on the page; the run goes red unless it was published (or was there already) and,
          # when pushed, the Pages build was asked for
          reset_live() {
            local out last
            # shellcheck disable=SC2086
            out=$(python3 pipeline/live_fetch.py --out _live --reset-live $PUB_ARGS 2>&1) || true
            printf '%s\n' "$out" | tail -n 4 | cut -c1-400
            last=$(printf '%s\n' "$out" | tail -n 1)
            if ! printf '%s\n' "$last" | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          pub, build = str(d.get("published") or "unchanged"), str(d.get("build") or "")
          sys.exit(0 if pub.split()[0] in ("pushed", "unchanged") and "failed" not in build else 1)' 2>/dev/null; then
              echo "::error::the reset was not published, or the page rebuild was not requested: ${last:0:300}"
              return 1
            fi
          }
          if [ "$RESET" = true ]; then reset_live; exit $?; fi
          crashes=0
          end=$(( $(date +%s) + MINUTES * 60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            # manual inputs and config edits made on GitHub; --no-overlay also removes a deleted file (OPS-14)
            git fetch -q origin "+refs/heads/$GITHUB_REF_NAME:refs/remotes/origin/$GITHUB_REF_NAME" \
              && git checkout -q --no-overlay "origin/$GITHUB_REF_NAME" -- live_input pipeline/live_config.json || true
            if python3 -c 'import json,sys; sys.exit(0 if json.load(open("pipeline/live_config.json")).get("github_feed", True) is False else 1)' 2>/dev/null; then
              echo 'live_config.json: "github_feed": false, stopping (the laptop takes over)'; break
            fi
            # one pass, then live_fetch.publish_step publishes when due (branch mode: every publish_every_min
            # minutes, the first results / exit polls at once) and has the page rebuilt
            args=(--out _live --once --publish --no-refresh)
            if [ "$DRILL" = true ]; then args+=(--drill --minutes "$MINUTES"); fi
            # shellcheck disable=SC2086
            out=$(python3 pipeline/live_fetch.py "${args[@]}" $PUB_ARGS 2>&1) || true
            printf '%s\n' "$out" | tail -n 4 | cut -c1-400
            last=$(printf '%s\n' "$out" | tail -n 1)
            # the pass's JSON line -> one log line; a publish that failed, or build requests given up, also as a warning
            if line=$(printf '%s\n' "$last" | python3 -c '
          import json, sys
          s = json.load(sys.stdin)
          print("changed", s["changed"], "| published", s.get("published", "-"), s.get("next_publish_s", ""), "| build", s.get("build", "-"), "| errors", s.get("errors"))
          bad = [e for e in s.get("errors") or [] if e.startswith("publish")]
          if str(s.get("published", "")).startswith("push failed") or "giving up" in str(s.get("build", "")) or bad:
              print("::warning::publishing:", s.get("published"), s.get("build"), bad)' 2>/dev/null); then
              crashes=0; echo "$(date -u +%H:%M:%S) $line" | cut -c1-600
            else   # not the JSON status line: the script crashed (WF-2); three in a row make the run red, and the queued run starts afresh
              crashes=$(( crashes + 1 ))
              echo "::error::live_fetch.py crashed ($crashes in a row): ${last:0:300}"
              echo "- $(date -u +%H:%M) UTC: live_fetch.py crashed ($crashes in a row): \`${last:0:200}\`" >> "$GITHUB_STEP_SUMMARY"
              if [ "$crashes" -ge 3 ]; then
                if [ "$DRILL" = true ]; then   # a drill that cannot go on still leaves the page as it found it
                  reset_live || true
                else
                  # shellcheck disable=SC2086
                  python3 pipeline/live_fetch.py --out _live --flush $PUB_ARGS || true
                fi
                exit 1
              fi
            fi
            sleep 45
          done
          # what the cadence held back goes out now, so the next run starts from it (timestamps alone wait: the
          # cadence carries over, and the next run publishes them when due)
          # shellcheck disable=SC2086
          python3 pipeline/live_fetch.py --out _live --flush $PUB_ARGS || echo '::warning::the final publish failed; the next run publishes again'
          if [ "$DRILL" = true ]; then   # the page returns to its pre-election state
            reset_live
          fi
