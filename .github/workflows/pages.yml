# Publishes the dashboard (site/index.html + site/data) to the gh-pages branch.
# One-time setup in the repository: Settings → Pages → Build and deployment →
# Source: "Deploy from a branch", Branch: gh-pages, folder: / (root).
name: Publish site

on:
  push:
    branches: [main, ccr-ecfe3046-hicnu4]
    paths: ['site/**', 'pipeline/build_site.py', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the page from site/src
        run: python3 pipeline/build_site.py
      - name: Assemble the static site
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          cp -r site/data _site/data
          # placeholder until the election-day feed writes live/ (keep_files leaves a real feed in place)
          mkdir -p _site/live
          [ -n "$(git ls-remote --heads origin gh-pages)" ] && git fetch -q origin gh-pages && \
            git cat-file -e origin/gh-pages:live/results.json 2>/dev/null || cp site/live/status.json _site/live/status.json
          touch _site/.nojekyll
      - name: Push to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          # keep files written by the election-day / election-night fetcher (live/)
          keep_files: true
          commit_message: 'Publish site from ${{ github.sha }}'

  # Can GitHub's runners reach the elections committee? (the election-night fetcher depends on it)
  net-check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe official hosts
        run: |
          for u in https://votes25.bechirot.gov.il/ https://media25.bechirot.gov.il/files/expb.csv \
                   https://votes26.bechirot.gov.il/ https://media26.bechirot.gov.il/ \
                   https://bechirot.gov.il/ https://www.gov.il/he https://www.cbs.gov.il/he/Pages/default.aspx; do
            printf '%s  ' "$u"
            curl -sS -o /dev/null -m 25 -r 0-4095 -A 'Mozilla/5.0 (kalpi26 net-check)' \
              -w 'http=%{http_code} bytes=%{size_download} ip=%{remote_ip} t=%{time_total}s\n' "$u" || echo 'FAILED'
          done
          echo '--- 2026 results files (test content before election day)'
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36'
          for f in expb.csv expc.csv; do
            echo "## media26 $f"
            curl -sS -m 25 -A "$UA" -D - -o /tmp/$f "https://media26.bechirot.gov.il/files/$f" | grep -iE '^(HTTP|content-type|content-length|last-modified|cache-control|etag|access-control)' || true
            head -c 1200 /tmp/$f | iconv -f cp1255 -t utf-8 2>/dev/null || head -c 1200 /tmp/$f
            echo; echo "lines: $(wc -l < /tmp/$f)"
          done
          echo '## cdn-votes26'
          curl -sS -o /dev/null -m 25 -A "$UA" -w 'http=%{http_code} bytes=%{size_download}\n' https://cdn-votes26.bechirot.gov.il/ || true
          echo '## is media26 refusing GitHub runners, or just empty? (DNS, then header variants)'
          getent hosts media26.bechirot.gov.il media25.bechirot.gov.il || true
          for v in "curl/8" "$UA" ; do
            for extra in "" "-H Referer:https://votes26.bechirot.gov.il/ -H Accept-Language:he-IL,he;q=0.9" "--http1.1"; do
              printf 'UA=%s %s -> ' "${v:0:20}" "$extra"
              curl -sS -o /tmp/p.bin -m 20 -A "$v" $extra -w 'http=%{http_code} bytes=%{size_download} type=%{content_type}' https://media26.bechirot.gov.il/files/expc.csv || true
              printf ' x-cache=%s\n' "$(curl -sS -I -m 20 -A "$v" https://media26.bechirot.gov.il/files/expc.csv 2>/dev/null | grep -i '^x-cache' | tr -d '\r')"
            done
          done
          for path in files/ files/expc.csv files/expb.csv index.html robots.txt; do
            printf '%s -> ' "$path"; curl -sS -o /dev/null -m 20 -A "$UA" -w 'http=%{http_code} bytes=%{size_download}\n' "https://media26.bechirot.gov.il/$path" || true
          done
