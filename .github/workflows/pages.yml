# Publishes the dashboard with GitHub Pages, Source "GitHub Actions": site/index.html + site/data
# from main, plus live/*.json from the live-data branch (written by the election-day feed, live.yml).
# Runs on every push to main that touches the site, and on workflow_dispatch (the feed dispatches it
# after each live-data push). Actions-based Pages has no builds-per-hour limit and never shares a
# branch with the feed.
#
# While Settings → Pages → Source is still "Deploy from a branch" (main, / root) this workflow only
# builds and reports: the page is then served straight from main (the root index.html forwards to
# site/) and live data cannot reach it. Switch the Source to "GitHub Actions" before 27.10
# (docs/ELECTION_DAY.md). The gh-pages branch is no longer used and can be deleted.
name: Publish site

on:
  push:
    branches: [main]
    paths: ['site/**', 'pipeline/build_site.py', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # one running + one pending; a newer pending run replaces the older, so the latest data deploys next

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deploy: ${{ steps.source.outputs.deploy }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build the page from site/src
        run: python3 pipeline/build_site.py
      - name: Assemble the static site
        run: |
          mkdir -p _site/live _site/site
          cp site/index.html _site/index.html
          cp -r site/data _site/data
          # live/*.json from the live-data branch (the election-day feed), else the placeholder
          if git fetch -q --depth=1 origin +refs/heads/live-data:refs/remotes/origin/live-data 2>/dev/null \
             && git cat-file -e origin/live-data:live/status.json 2>/dev/null; then
            git archive origin/live-data live | tar -x -C _site
            echo "live/ from live-data $(git rev-parse --short origin/live-data)"
          else
            cp site/live/status.json _site/live/status.json
            echo 'live/ is the placeholder (no live-data branch yet)'
          fi
          # the branch-mode address .../site/ keeps working: it forwards to the root
          cat > _site/site/index.html <<'EOF'
          <!doctype html>
          <html lang="he" dir="rtl"><head><meta charset="utf-8"><title>קלפי 26</title>
          <meta http-equiv="refresh" content="0; url=../"><script>location.replace('../' + location.hash);</script>
          </head><body><a href="../">קלפי 26</a></body></html>
          EOF
          touch _site/.nojekyll
          ls -la _site _site/live
      - name: Which Pages source is configured?
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # "workflow" = Source: GitHub Actions; "legacy" = Deploy from a branch; empty = not enabled or no access
          type=$(curl -sS -m 30 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                   "https://api.github.com/repos/$GITHUB_REPOSITORY/pages" \
                 | python3 -c 'import json,sys; print((json.load(sys.stdin) or {}).get("build_type") or "")' 2>/dev/null || true)
          echo "Pages build_type: ${type:-unknown}"
          if [ "$type" = "workflow" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Pages deploys from a branch (build_type: ${type:-unknown}); nothing was deployed"
              echo
              echo "The site is served from main/site/. Switch **Settings → Pages → Build and deployment → Source** to"
              echo "**GitHub Actions** before 27.10 for live election-night updates (docs/ELECTION_DAY.md)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-pages-artifact@v5
        if: steps.source.outputs.deploy == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15   # a Pages deployment times out after 10 minutes
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
