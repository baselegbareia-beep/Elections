# "Publish site": the GitHub Actions path of GitHub Pages, kept working for the day the Source is switched.
#
# The owner's setting is Settings → Pages: "Deploy from a branch: main / (root)" (build_type legacy). Then this
# workflow only builds and reports, green: the page is served straight from main (the root index.html forwards
# to site/), and the election-day feed (live.yml) commits its data to site/live/ on main and requests a Pages
# build itself. Nothing here is needed for that.
#
# If the Source is ever "GitHub Actions" (build_type workflow), this workflow deploys site/index.html +
# site/data from main, plus live/*.json: the newer of the live-data branch (the feed's Actions path) and
# main's site/live/. It runs on pushes to main that touch the site (never for site/live/**, which only the
# feed writes) and on workflow_dispatch (the feed dispatches it after each live-data push).
name: Publish site

on:
  push:
    branches: [main]
    paths: ['site/**', '!site/live/**', 'pipeline/build_site.py', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # one running + one pending; a newer pending run replaces the older, so the latest data deploys next

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deploy: ${{ steps.source.outputs.deploy }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build the page from site/src
        run: python3 pipeline/build_site.py
      - name: Assemble the static site
        run: |
          mkdir -p _site/live _site/site
          cp site/index.html _site/index.html
          cp -r site/data _site/data
          # live/*.json: main's site/live/ (branch mode, or the placeholder), replaced by the live-data branch
          # (the feed's Actions path) when that one is newer
          cp site/live/*.json _site/live/
          if git fetch -q --depth=1 origin +refs/heads/live-data:refs/remotes/origin/live-data 2>/dev/null \
             && git cat-file -e origin/live-data:live/status.json 2>/dev/null; then
            newer=$(git show origin/live-data:live/status.json | python3 -c '
          import datetime as dt, json, sys
          def t(d):
              try:
                  return dt.datetime.fromisoformat(d["updated_at"]).timestamp()
              except Exception:
                  return 0
          print("live-data" if t(json.load(sys.stdin)) >= t(json.load(open("site/live/status.json"))) else "main")' 2>/dev/null || echo live-data)
            if [ "$newer" = live-data ]; then
              rm -f _site/live/*.json
              git archive origin/live-data live | tar -x -C _site
            fi
            echo "live/ from $newer (live-data $(git rev-parse --short origin/live-data))"
          else
            echo 'live/ from main site/live/ (no live-data branch)'
          fi
          # the branch-mode address .../site/ keeps working: it forwards to the root
          cat > _site/site/index.html <<'EOF'
          <!doctype html>
          <html lang="he" dir="rtl"><head><meta charset="utf-8"><title>קלפי 26</title>
          <meta http-equiv="refresh" content="0; url=../"><script>location.replace('../' + location.hash);</script>
          </head><body><a href="../">קלפי 26</a></body></html>
          EOF
          touch _site/.nojekyll
          ls -la _site _site/live
      - name: Which Pages source is configured?
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_ANYWAY: ${{ vars.PAGES_DEPLOY_ANYWAY }}   # "true": deploy even when the check below cannot be made
        run: |
          # "legacy" = Deploy from a branch (the owner's setting): nothing to deploy, green; "workflow" = Source:
          # GitHub Actions: deploy; anything else = the check itself failed (API, token, network): say so, red (WF-3)
          resp=$(curl -sS -m 30 -w '\n%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                   "https://api.github.com/repos/$GITHUB_REPOSITORY/pages" 2>/dev/null) || resp=$'\n000'
          http=${resp##*$'\n'}
          type=$(printf '%s' "${resp%$'\n'*}" | python3 -c 'import json,sys; print((json.load(sys.stdin) or {}).get("build_type") or "")' 2>/dev/null || true)
          echo "Pages build_type: ${type:-unknown} (http=$http)"
          case "$type" in
            workflow)
              echo "deploy=true" >> "$GITHUB_OUTPUT"
              echo "Pages build_type: workflow (Source: GitHub Actions); deploying" >> "$GITHUB_STEP_SUMMARY" ;;
            legacy)
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              {
                echo "## Pages deploys from a branch (build_type: legacy): built and checked, nothing to deploy"
                echo
                echo "The site is served from main (site/), live data included: the election-day feed commits site/live/"
                echo "to main and requests a Pages build itself (docs/ELECTION_DAY.md). This is the intended setting."
              } >> "$GITHUB_STEP_SUMMARY" ;;
            *)
              if [ "$DEPLOY_ANYWAY" = true ]; then
                echo "deploy=true" >> "$GITHUB_OUTPUT"
                echo "::warning::the Pages source check failed (http=$http); deploying anyway (repository variable PAGES_DEPLOY_ANYWAY=true)"
                echo "## :warning: The Pages source check failed (http=$http); deployed anyway (PAGES_DEPLOY_ANYWAY=true)" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "deploy=false" >> "$GITHUB_OUTPUT"
                echo "::error::the Pages source check failed (GET /repos/$GITHUB_REPOSITORY/pages: http=$http); nothing was deployed"
                {
                  echo "## :x: The Pages source check failed (http=$http); nothing was deployed"
                  echo
                  echo "This is the check itself (API, token or network), not the Pages setting. Under \"Deploy from a branch\""
                  echo "(the intended setting) this workflow deploys nothing anyway. Under \"GitHub Actions\", if it keeps failing,"
                  echo "set the repository variable **PAGES_DEPLOY_ANYWAY** = \`true\` (Settings → Secrets and variables → Actions → Variables)."
                } >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi ;;
          esac
      - uses: actions/upload-pages-artifact@v5
        if: steps.source.outputs.deploy == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15   # a Pages deployment times out after 10 minutes
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
